name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          echo "Installing linting dependencies..."
          pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: |
          echo "Running flake8 code style check..."
          flake8 src/ tests/ --max-line-length=120 --count --statistics
        continue-on-error: false

  build-and-test:
    name: 🔧 Build and Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          echo "Installing project dependencies..."
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          echo "Running test suite..."
          python -m pytest tests/ -v

      - name: Build verification
        run: |
          echo "✅ Environment setup complete"
          python --version
          pip list | head -15

  deploy:
    name: 🚀 Deploy to Streamlit Cloud
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm Deployment Trigger
        run: echo "✅ CI/CD pipeline completed successfully. Triggering Streamlit Cloud deployment..."

